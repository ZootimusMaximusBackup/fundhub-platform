<title>Fundhub</title>
<style>
  /* There is deliberately almost no chrome here. The screens are the product;
     this file's whole job is to be invisible and let someone click through the
     site and the CRM the way they would in production. The only visible thing
     that is not the product is the jump pill, and it stays out of the way. */
  :root{
    --spectrum:linear-gradient(90deg,#F2A69B 0%,#F5CE8F 20%,#F2E39B 40%,#A8D8B0 60%,#A9C6E8 80%,#C4B3E5 100%);
    --ink:#0A0A0A;
    --card:#111113;
    --cardline:#26262B;
    --cardtext:#E4E4E7;
    --dim:#8A8A93;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#fff;font-family:var(--sans)}
  iframe#frame{width:100%;height:100%;border:0;display:block;background:#fff}

  /* ── Jump pill ──────────────────────────────────────────────────────── */
  .pill{
    position:fixed; right:16px; bottom:16px; z-index:20;
    appearance:none; cursor:pointer; font:inherit;
    display:flex; align-items:center; gap:8px;
    padding:7px 13px 7px 11px; border-radius:999px;
    background:rgba(17,17,19,.82); border:1px solid var(--cardline);
    color:#9A9AA3; font-size:11.5px; letter-spacing:.02em;
    backdrop-filter:blur(8px); opacity:.45; transition:opacity .18s ease,color .18s ease;
  }
  .pill:hover,.pill:focus-visible{opacity:1;color:#fff}
  .pill:focus-visible{outline:2px solid #A9C6E8; outline-offset:2px}
  .pill .bar{width:18px;height:3px;border-radius:2px;background:var(--spectrum)}
  .pill kbd{
    font-family:var(--mono); font-size:10px; color:#6E6E77;
    border:1px solid #33333A; border-radius:4px; padding:1px 4px;
  }

  /* ── Jump sheet ─────────────────────────────────────────────────────── */
  .sheet[hidden]{display:none}
  .sheet{
    position:fixed; inset:0; z-index:30;
    background:rgba(10,10,10,.6); backdrop-filter:blur(4px);
    display:flex; align-items:flex-start; justify-content:center;
    padding:8vh 20px 20px;
  }
  .panel{
    width:min(720px,100%); max-height:78vh; overflow-y:auto;
    background:var(--card); border:1px solid var(--cardline); border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.5); color:var(--cardtext);
  }
  .panel-head{
    position:sticky; top:0; background:var(--card);
    padding:18px 20px 12px; border-bottom:1px solid var(--cardline);
    display:flex; align-items:center; gap:12px;
  }
  .panel-head b{font-size:15px; font-weight:700; letter-spacing:-.01em}
  .panel-head .bar{width:26px;height:3px;border-radius:2px;background:var(--spectrum)}
  .panel-head span{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--dim); margin-left:auto;
  }
  .grp{padding:16px 20px 4px}
  .grp h2{
    margin:0 0 8px; font-family:var(--mono); font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--dim); font-weight:600;
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px}
  .go{
    appearance:none; border:0; background:none; cursor:pointer; font:inherit;
    text-align:left; padding:8px 10px; border-radius:7px;
    font-size:13.5px; color:#B4B4BC;
  }
  .go:hover{background:#1C1C21; color:#fff}
  .go:focus-visible{outline:2px solid #A9C6E8; outline-offset:1px}
  .go[aria-current="true"]{background:#1C1C21; color:#fff}
  .panel-foot{
    padding:12px 20px 18px; color:#6E6E77; font-size:11.5px; line-height:1.5;
    border-top:1px solid var(--cardline); margin-top:12px;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<iframe id="frame" title="Fundhub"></iframe>

<button class="pill" id="pill" type="button" aria-haspopup="dialog">
  <span class="bar"></span>Jump to screen <kbd>/</kbd>
</button>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Jump to screen">
  <div class="panel" id="panel">
    <div class="panel-head"><b>fundhub</b><span class="bar"></span><select id="roleSwitch" style="margin-left:auto;padding:4px 8px;border-radius:4px;border:1px solid var(--cardline);background:var(--card);color:var(--cardtext);font-size:11px;cursor:pointer"><option value="admin">Admin</option><option value="staff" selected>Staff</option><option value="partner">Partner</option><option value="affiliate">Affiliate</option><option value="client">Client</option></select><span id="here" style="margin-left:12px">index.html</span></div>
    <div id="groups"></div>
    <p class="panel-foot">
      Sign in is pre-filled — hit Sign in on the login screen and you land in the CRM,
      same as production. Screens that read live data fall back to their sample sets.
    </p>
  </div>
</div>

<script id="nav-data" type="application/json">/*__NAV__*/null</script>
<script id="page-data" type="application/json">/*__PAGES__*/null</script>
<script>
(function(){
  var NAV = JSON.parse(document.getElementById("nav-data").textContent);
  var PAGES = JSON.parse(document.getElementById("page-data").textContent);

  var frame = document.getElementById("frame");
  var sheet = document.getElementById("sheet");
  var pill  = document.getElementById("pill");
  var here  = document.getElementById("here");
  var current = null, history = [], buttons = {}, currentRole = 'staff';

  /* RBAC: single source of truth (mirrors src/lib/rbac.ts). Only app/ routes
     are gated — the public site (index, login, education, etc.) is open to
     everyone, same as production before anyone signs in. */
  var ROLE_ROUTES = {
    admin: ['app/closer-dashboard.html','app/pipeline.html','app/client-control-panel.html','app/messaging.html','app/calendar.html','app/documents.html','app/campaign-manager.html','app/social-studio.html','app/creative-factory.html','app/command-center.html','app/ops-admin.html','app/galaxy.html','app/automations.html','app/agent-editor.html','app/hiring.html','app/products-commissions.html','app/staff-teams.html','app/content-admin.html','app/brand-studio.html','app/inquiry-remover.html','app/client-portal.html','app/partner-galaxy.html','app/affiliate.html'],
    // All internal ops screens, minus billing/admin settings (ops-admin, products-commissions).
    staff: ['app/closer-dashboard.html','app/pipeline.html','app/client-control-panel.html','app/messaging.html','app/calendar.html','app/documents.html','app/campaign-manager.html','app/social-studio.html','app/creative-factory.html','app/command-center.html','app/galaxy.html','app/automations.html','app/agent-editor.html','app/hiring.html','app/staff-teams.html','app/content-admin.html','app/brand-studio.html','app/inquiry-remover.html','app/client-portal.html'],
    // Partner Galaxy + Affiliate Portal + Client Portal + brand design + Facebook ads (campaign-manager).
    partner: ['app/partner-galaxy.html','app/affiliate.html','app/client-portal.html','app/brand-studio.html','app/campaign-manager.html'],
    affiliate: ['app/affiliate.html','app/client-portal.html'],
    client: ['app/client-portal.html'],
  };
  var ROLE_DEFAULTS = {admin:'app/command-center.html', staff:'app/closer-dashboard.html', partner:'app/partner-galaxy.html', affiliate:'app/affiliate.html', client:'app/client-portal.html'};

  function canAccess(role, path){
    if(role === 'admin') return true;
    if(path.indexOf('app/') !== 0) return true; // public site — no gate
    var allowed = ROLE_ROUTES[role] || [];
    return allowed.indexOf(path) !== -1;
  }

  var HOME = ROLE_DEFAULTS[currentRole];

  var groups = document.getElementById("groups");

  /* The jump sheet lists only what the current role can reach — an affiliate
     never sees that Campaigns or Hiring exist, same as the sidebar. Rebuilt
     from scratch on every role switch. */
  function buildPanel(role){
    groups.innerHTML = "";
    buttons = {};
    NAV.forEach(function(g){
      var pages = g.pages.filter(function(p){ return canAccess(role, p.rel); });
      if(!pages.length) return;
      var sec = document.createElement("section"); sec.className = "grp";
      var h = document.createElement("h2"); h.textContent = g.name; sec.appendChild(h);
      var grid = document.createElement("div"); grid.className = "grid";
      pages.forEach(function(p){
        var b = document.createElement("button");
        b.className = "go"; b.type = "button"; b.textContent = p.label;
        b.addEventListener("click", function(){ closeSheet(); go(p.rel); });
        buttons[p.rel] = b; grid.appendChild(b);
      });
      sec.appendChild(grid); groups.appendChild(sec);
    });
    Object.keys(buttons).forEach(function(k){
      buttons[k].setAttribute("aria-current", String(k === current));
    });
  }
  buildPanel(currentRole);

  function render(rel){
    current = rel;
    // Stamp the CURRENT viewer's role onto the document right before it's
    // framed — this is what the page's own bridge script reads to filter its
    // sidebar. Never the page's build-time identity, always who's looking.
    frame.srcdoc = PAGES[rel].replace(/data-role="[^"]*"/, 'data-role="' + currentRole + '"');
    here.textContent = rel;
    Object.keys(buttons).forEach(function(k){
      buttons[k].setAttribute("aria-current", String(k === rel));
    });
  }

  function go(rel){
    if (!PAGES[rel] || rel === current) return;
    if (!canAccess(currentRole, rel)) {
      go(ROLE_DEFAULTS[currentRole]);
      return;
    }
    if (current) history.push(current);
    render(rel);
  }

  function back(){
    var prev = history.pop();
    if (prev) render(prev);
  }

  function openSheet(){
    sheet.hidden = false;
    var cur = buttons[current];
    (cur || document.querySelector(".go")).focus();
  }
  function closeSheet(){ sheet.hidden = true; pill.focus(); }

  pill.addEventListener("click", openSheet);
  sheet.addEventListener("click", function(e){ if (e.target === sheet) closeSheet(); });

  /* Dev mode: role switcher */
  var roleSwitch = document.getElementById("roleSwitch");
  roleSwitch.addEventListener("change", function(e){
    currentRole = e.target.value;
    HOME = ROLE_DEFAULTS[currentRole];
    history = [];
    current = null; // force render(): HOME may equal the stale `current`
    buildPanel(currentRole);
    go(HOME);
  });

  /* Also called with a plain object forwarded from a framed screen, which has
     no preventDefault and no target — hence the guards. */
  function keys(e){
    var t = e.target;
    var typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
    var stop = function(){ if (typeof e.preventDefault === "function") e.preventDefault(); };
    if (e.key === "Escape" && !sheet.hidden) { closeSheet(); return; }
    if (e.key === "/" && sheet.hidden && !typing) { stop(); openSheet(); return; }
    if (e.altKey && e.key === "ArrowLeft") { stop(); back(); }
  }
  document.addEventListener("keydown", keys);

  /* Resolve an href the way the served site would: relative to the route the
     link was written in. /app/pipeline.html's "calendar.html" is the CRM's
     calendar; the marketing site's "/login.html" is the sign-in page. */
  function resolve(from, href){
    href = href.split("#")[0].split("?")[0];
    var absolute = href.charAt(0) === "/";
    if (!href) return null;
    var base = from.indexOf("/") === -1 ? [] : from.split("/").slice(0, -1);
    var parts = absolute ? href.replace(/^\/+/, "").split("/")
                         : base.concat(href.split("/"));
    var out = [];
    parts.forEach(function(p){
      if (p === "" || p === ".") return;
      if (p === "..") out.pop(); else out.push(p);
    });
    var rel = out.join("/");
    if (rel === "") return "index.html";               // "/" — site root
    if (PAGES[rel]) return rel;
    if (PAGES[rel + "/index.html"]) return rel + "/index.html";
    if (rel === "app") return HOME;                    // /app and /app/
    return null;
  }

  window.addEventListener("message", function(e){
    var d = e.data;
    if (!d || !d.fh) return;
    if (d.fh === "navigate") {
      var rel = resolve(d.from || current || "", d.href);
      if (rel) go(rel);
      return;
    }
    /* Sign-in. The real handler posts to /api/auth/login and forwards to
       /app/ on a token; there is no API here, so the shell does the forward
       and the form never gets to fail. */
    if (d.fh === "signin") go(HOME);
    if (d.fh === "keydown") keys(d.event || {});
  });

  go("index.html");
})();
</script>
