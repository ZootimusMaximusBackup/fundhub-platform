<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
/* single fixed grid layer — one paint, survives zoom */
html,body{margin:0!important;padding:0!important;background:transparent!important;overflow-x:hidden!important}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-color:#FCFCFC;
  background-image:
    linear-gradient(rgba(10,10,10,.048) 1px,transparent 1px),
    linear-gradient(90deg,rgba(10,10,10,.048) 1px,transparent 1px);
  background-size:44px 44px;
}

body>div:last-child{margin-bottom:0!important;padding-bottom:0!important}
.c-section,.c-wrapper,.fullSection,.c-row,.c-column,.inner,.c-custom-code,.custom-code,
.hl_page-preview--content,.elWrapper,.containerWrapper,
[data-page-element="SectionContainer/V1"],
[data-page-element="RowContainer/V1"],
[data-page-element="ColContainer/V1"],
[data-page-element="CustomHtmlJs/V1"]{
  max-width:none!important;width:100%!important;
  padding-bottom:0!important;margin-bottom:0!important;
  border-radius:0!important;background:transparent!important;border:none!important;
}
/* sandwich section around native widgets stays transparent so grid shows */
[data-page-element="SectionContainer/V1"]:has([data-page-element="Survey/V1"]),
[data-page-element="SectionContainer/V1"]:has([data-page-element="AppointmentScheduler/V1"]),
[data-page-element="RowContainer/V1"]:has([data-page-element="Survey/V1"]),
[data-page-element="RowContainer/V1"]:has([data-page-element="AppointmentScheduler/V1"]),
[data-page-element="ColContainer/V1"]:has([data-page-element="Survey/V1"]),
[data-page-element="ColContainer/V1"]:has([data-page-element="AppointmentScheduler/V1"]){
  background:transparent!important;border:none!important;border-radius:0!important;
}

/* floating card for native CF widgets (Survey + AppointmentScheduler) */
[data-page-element="Survey/V1"],
[data-page-element="AppointmentScheduler/V1"],
.fh-widget-slot{
  display:block!important;
  box-sizing:border-box!important;
  max-width:900px!important;
  width:calc(100% - 48px)!important;
  margin:20px auto!important;
  background:#FCFCFC!important;
  border:1px solid #E4E4E7!important;
  border-radius:14px!important;
  box-shadow:0 18px 44px rgba(10,10,10,.10)!important;
  overflow:hidden!important;
  padding:12px!important;
}
[data-page-element="Survey/V1"] #calContainer,
[data-page-element="AppointmentScheduler/V1"] #calContainer{
  max-width:100%!important;margin:0!important;box-shadow:none!important;
}

/* one surface: flatten the widget's internal greys onto the paper card */
[data-page-element="AppointmentScheduler/V1"] div{background-color:transparent!important}


/* CALENDAR SIZE DIAL — change --cal-zoom only.
   1 = full size, .9 = 90%, .8 = 80%. Scales width AND height together,
   so the card gets genuinely smaller instead of narrower-and-taller. */
[data-page-element="AppointmentScheduler/V1"]{
  --cal-zoom:.8;
  padding:8px!important;
}
[data-page-element="AppointmentScheduler/V1"] > *{
  zoom:var(--cal-zoom);
}


.fh-root{
  --spectrum:linear-gradient(90deg,#F2A69B 0%,#F5CE8F 20%,#F2E39B 40%,#A8D8B0 60%,#A9C6E8 80%,#C4B3E5 100%);
  --paper:#FCFCFC; --ink:#0A0A0A; --ink2:#18181B; --gray:#52525B; --gray2:#8A8A93;
  --line:#E4E4E7; --soft:#F4F4F5; --card:#111113; --cardline:#26262B;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;

  width:100%;margin-left:0;
  background:transparent;color:var(--ink);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.fh-root *{box-sizing:border-box;margin:0;padding:0}
.fh-root a{color:inherit;text-decoration:none}
.fh-root :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fh-root .wrap{max-width:900px;margin:0 auto;padding:0 24px}

.fh-root .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);display:inline-block}
.fh-root .eyebrow::before{content:"";display:inline-block;width:16px;height:2px;background:var(--spectrum);border-radius:1px;margin-right:9px;vertical-align:middle}
.fh-root header{padding:18px 0 0;text-align:center}
.fh-root header .logo{width:124px;height:25px}
@media(max-width:640px){.fh-root header{padding:11px 0 0}.fh-root header .logo{width:104px;height:21px}}

.fh-root .hero{text-align:center;padding:34px 0 8px}
.fh-root .hero h1{font-family:var(--sans);font-size:clamp(30px,5.2vw,50px);font-weight:700;letter-spacing:-.045em;line-height:.98;margin:20px auto 0;max-width:19ch}
.fh-root .hero h1.sec{font-size:clamp(19px,2.6vw,26px);font-weight:600;color:var(--gray);letter-spacing:-.02em;line-height:1.2;margin-top:16px;max-width:24ch}
.fh-root .hero .lede{margin:20px auto 0;font-size:16.5px;color:var(--gray);max-width:50ch}
@media(max-width:640px){.fh-root .hero{padding:22px 0 4px}}

/* === V2 widget polish (live-DOM selectors 2026-08-11) === */

/* Inter across scheduler; restore Font Awesome on real icon classes */
[data-page-element="AppointmentScheduler/V1"],
[data-page-element="AppointmentScheduler/V1"] *:not(i):not(svg){
  font-family:'Inter',system-ui,-apple-system,sans-serif!important;
}
[data-page-element="AppointmentScheduler/V1"] i.fa-solid,
[data-page-element="AppointmentScheduler/V1"] i.fas,
[data-page-element="AppointmentScheduler/V1"] i.fa,
[data-page-element="AppointmentScheduler/V1"] i[class*="fa-"]{
  font-family:"Font Awesome 6 Pro","Font Awesome 5 Free","Font Awesome 6 Free",FontAwesome!important;
  font-style:normal!important;
  font-weight:900!important;
}

/* Confirm CTA — button (flatten only hits divs; do not undo flatten) */
[data-page-element="AppointmentScheduler/V1"] button.cf2__confirm-button,
[data-page-element="AppointmentScheduler/V1"] button.DTP__confirm-button{
  background-color:#188bf6!important;
  background:#188bf6!important;
  color:#fff!important;
  border:1px solid #188bf6!important;
  border-radius:9px!important;
  min-height:44px!important;
  padding:10px 18px!important;
