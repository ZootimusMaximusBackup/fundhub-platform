<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fundhub — Advisor Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fh.css">
</head><body>
<div class="spectrum"></div>
<header class="top"><span class="brand">fundhub matrix</span><nav></nav><span class="who"></span><button id="logout">Sign out</button></header>
<div class="wrap">
  <h1>Advisor Ops</h1>
  <p class="sub">The working queue — blockers first. Bureau pulls wire in at cutover; inquiry launches live in the <a href="/inquiry.html">Inquiry Console</a>.</p>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <input id="q" placeholder="Search…" style="flex:1">
      <select id="filter">
        <option value="all">All</option>
        <option value="blocked">Never pulled (blocker)</option>
        <option value="tasks">Has open tasks</option>
        <option value="deposit">Deposit paid</option>
        <option value="funded">Funded</option>
      </select>
    </div>
    <table class="tbl"><thead><tr>
      <th>Client</th><th>Outcome</th><th>Blockers</th><th>Tasks</th><th class="right">Prequal</th><th>Last touch</th>
    </tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table>
  </div>
  <div id="detail"></div>
</div>
<script src="/fh.js"></script>
<script>
let CLIENTS = [], SELECTED = null;

function blockers(c) {
  const b = [];
  if (!Number(c.crs_count)) b.push(`<span class="chip alert">Credit: Never Pulled</span>`);
  if (!c.custom_fields?.crs_paid) b.push(`<span class="chip warn">CRS unpaid</span>`);
  if (c.outcome_tier === "FRAUD_HOLD") b.push(`<span class="chip alert">FRAUD HOLD</span>`);
  if (c.outcome_tier === "MANUAL_REVIEW") b.push(`<span class="chip accent">Manual review</span>`);
  return b;
}

function renderList() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const f = document.getElementById("filter").value;
  const rows = document.getElementById("rows");
  const list = CLIENTS.filter(c => {
    if (q && !`${c.first_name||""} ${c.last_name||""} ${c.email||""}`.toLowerCase().includes(q)) return false;
    if (f === "blocked") return !Number(c.crs_count);
    if (f === "tasks") return Number(c.task_count) > 0;
    if (f === "deposit") return !!c.custom_fields?.deposit_paid;
    if (f === "funded") return !!c.funded;
    return true;
  });
  rows.innerHTML = list.length ? "" : `<tr><td colspan="6" class="empty">Nothing in this view.</td></tr>`;
  for (const c of list) {
    const b = blockers(c);
    rows.insertAdjacentHTML("beforeend", `
      <tr class="click" onclick="pick('${c.id}')">
        <td><b>${FH.esc((c.first_name||"")+" "+(c.last_name||""))}</b><br><span class="muted mono">${FH.esc(c.email||"")}</span></td>
        <td>${FH.tierChip(c.outcome_tier)}</td>
        <td>${b.length ? b.join(" ") : `<span class="chip ok">Clear</span>`}</td>
        <td>${Number(c.task_count) ? `<span class="chip warn">${c.task_count}</span>` : `<span class="chip">0</span>`}</td>
        <td class="right">${FH.money(c.custom_fields?.total_funding_estimate)}</td>
        <td class="muted">${c.transactions?.latest_product ? FH.esc(c.transactions.latest_product) : "—"}</td>
      </tr>`);
  }
}

function kpis() {
  const blocked = CLIENTS.filter(c=>!Number(c.crs_count)).length;
  const withTasks = CLIENTS.filter(c=>Number(c.task_count)>0).length;
  const deposits = CLIENTS.filter(c=>c.custom_fields?.deposit_paid).length;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi info"><div class="lbl">Total clients</div><div class="val">${CLIENTS.length}</div></div>
    <div class="kpi alert"><div class="lbl">Never pulled</div><div class="val">${blocked}</div></div>
    <div class="kpi warn"><div class="lbl">With open tasks</div><div class="val">${withTasks}</div></div>
    <div class="kpi ok"><div class="lbl">Deposits paid</div><div class="val">${deposits}</div></div>`;
}

async function load() {
  const { ok, data } = await FH.api("/api/dashboard/clients?limit=200");
  if (!ok) return;
  CLIENTS = data.clients || [];
  kpis(); renderList();
}

window.pick = async (id) => {
  SELECTED = id;
  const box = document.getElementById("detail");
  box.innerHTML = `<div class="card"><div class="empty">Loading…</div></div>`;
  const { ok, data } = await FH.api("/api/dashboard/client?id=" + id);
  if (!ok) { box.innerHTML = `<div class="card"><div class="empty">Failed.</div></div>`; return; }
  const c = data.client, cf = c.custom_fields || {};
  const open = data.tasks.filter(t=>!t.done);
  box.innerHTML = `
    <div class="card">
      <h2>Control panel — ${FH.esc((c.first_name||"")+" "+(c.last_name||""))}</h2>
      <div class="row" style="margin-bottom:12px">
        ${FH.tierChip(c.outcome_tier)}
        ${Number(data.crs_results.length) ? `<span class="chip info">${data.crs_results.length} CRS pull${data.crs_results.length>1?"s":""}</span>` : `<span class="chip alert">Credit status: Never Pulled</span>`}
        ${cf.deposit_paid ? `<span class="chip ok">Deposit paid</span>` : ``}
        ${cf.sale_closed ? `<span class="chip ok">Sale closed</span>` : ``}
      </div>
      <div class="kv" style="margin-bottom:12px">
        <span class="k">Email</span><span class="mono">${FH.esc(c.email||"—")}</span>
        <span class="k">Phone</span><span class="mono">${FH.esc(c.phone||"—")}</span>
        <span class="k">Prequal</span><span>${FH.money(cf.total_funding_estimate)}</span>
        <span class="k">DND</span><span>${["sms","email","voice"].filter(k=>c["dnd_"+k]).join(", ") || "none"}</span>
      </div>
      <h2>Actions</h2>
      <div class="row">
        <button class="btn" disabled title="Wired at cutover — CRS request path">Pull TransUnion</button>
        <button class="btn" disabled title="Wired at cutover — CRS request path">Pull Experian</button>
        <button class="btn" disabled title="Wired at cutover — CRS request path">Pull Equifax</button>
        <a class="btn" href="/inquiry.html">Issue inquiry removal →</a>
      </div>
      <p class="note">Disabled buttons are intentional: the CRS request path goes live at cutover. Everything enabled here is real.</p>
    </div>
    <div class="card"><h2>Open tasks (${open.length})</h2>
      ${open.length ? open.map(t => `
        <div class="row" style="justify-content:space-between;border-bottom:1px solid var(--soft);padding:6px 0">
          <span>${FH.esc(t.title)}<br><span class="muted mono">${FH.esc(t.source_workflow||"")} · ${FH.ago(t.created_at)} ago</span></span>
          <button class="btn" onclick="doneTask('${t.id}')">Done</button></div>`).join("")
        : `<div class="empty">Clear.</div>`}
    </div>`;
};

window.doneTask = async (id) => {
  const { ok } = await FH.api("/api/tasks", { method: "PATCH", body: { id, done: true } });
  if (ok) { FH.toast("Task done"); if (SELECTED) pick(SELECTED); load(); }
};

(async () => {
  if (!(await FH.guard())) return;
  document.getElementById("q").addEventListener("input", renderList);
  document.getElementById("filter").addEventListener("change", renderList);
  FH.poll(load, 15000);
})();
</script>
</body></html>
