<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Your Live Trial</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"/>
<!--
  THE LIVE TRIAL DASHBOARD. Not the sales page — that is /partner/trial/ and it
  belongs to a different unit. This is the screen somebody opens after they have
  paid $297, and it is the product: they watch their own name book real calls
  for a week.

  EVERYTHING ON IT COMES FROM GET /api/trials/dashboard. There is no sample
  data, no demo mode, and no number typed into this file.

  FIVE THINGS HERE ARE NOT DECORATION AND MUST NOT BE REMOVED:

  1. NO EARNINGS CLAIMS, ANYWHERE. Zero measured paid closes exist. This page
     may show THIS person's own live numbers and nothing else — never a typical
     result, never a range, never another buyer's trial, never a projection of
     what the week will produce. The limitation line is written by the API, not
     typed here, so it cannot be softened on the page without changing the API.

  2. ZERO IS RENDERED AS ZERO. A trial that has booked nothing says nothing
     booked. Hiding that behind a friendly empty state would be the one lie this
     screen could tell, and it is the number the day-8 conversation turns on.

  3. NULL IS NOT ZERO. "Spend — not known yet" means the platform has not synced.
     "$0" would mean the platform says they spent nothing. Those have different
     refund conversations attached, so they never share a rendering.

  4. THE CLOCK STARTS AT THE FIRST AD IMPRESSION. A trial that is paid for and
     built but not yet serving shows "not started", not "day 1 of 7".

  5. THE HELD-START NOTICE. A buyer waiting on Meta business verification has a
     fully delivered trial with no clock. The page says so plainly and does not
     pretend to know how long Meta takes, because nobody has measured it.

  NO LENDER DATA IS ON THIS PAGE and none may be added. Partners never see
  lender bands, payout percentages or fulfilment playbooks.
-->
<style>
  :root{
    --paper:#FCFCFC; --ink:#0A0A0A; --ink2:#27272A;
    --line:#E4E4E7; --gray:#6B7280; --gray2:#9CA3AF;
    --blue:#188bf6; --card:#FFFFFF;
    --good:#16A34A; --warn:#D97706; --bad:#DC2626;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:var(--card);padding:18px 0}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:19px;letter-spacing:-.03em}
  .logo span{color:var(--blue)}
  .pill{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink2);background:var(--card)}
  .pill.live{border-color:#BBF7D0;background:#F0FDF4;color:#166534;font-weight:600}
  .pill.frozen{border-color:#E4E4E7;background:#FAFAFA;color:var(--gray)}

  h1{font-size:27px;letter-spacing:-.02em;margin:26px 0 4px}
  .sub{color:var(--gray);margin:0 0 20px}

  .notice{border:1px solid #FED7AA;background:#FFF7ED;border-radius:11px;padding:14px 16px;margin:0 0 18px}
  .notice p{margin:0 0 6px;font-size:14px}
  .notice p:last-child{margin:0}

  .limit{border:1px dashed var(--line);border-radius:11px;padding:12px 15px;margin:0 0 22px;color:var(--gray);font-size:13.5px}

  .tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin:0 0 22px}
  .tile{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:15px 16px}
  .tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);margin:0 0 7px}
  .tile .v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0}
  .tile .v.unknown{font-size:15px;color:var(--gray2);font-family:var(--sans);padding-top:9px}
  .tile .n{font-size:12.5px;color:var(--gray);margin:6px 0 0}
  .tile.hero{border-color:#BFDBFE;background:#F5FAFF}

  h2{font-size:17px;letter-spacing:-.01em;margin:26px 0 10px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);font-weight:600}
  tr:last-child td{border-bottom:none}
  td.mono{font-family:var(--mono);font-size:13px}

  .plan{display:grid;gap:9px;margin:0 0 10px;padding:0;list-style:none}
  .plan li{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 14px;display:flex;gap:12px;align-items:flex-start}
  .plan li.now{border-color:#BFDBFE;background:#F5FAFF}
  .plan li.done{opacity:.55}
  .day{font-family:var(--mono);font-size:12px;color:var(--gray);min-width:46px;padding-top:2px}
  .plan h3{margin:0 0 2px;font-size:14.5px;font-weight:600}
  .plan p{margin:0;font-size:13.5px;color:var(--gray)}
  .who{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray2);margin-left:auto;padding-top:3px}

  .state{border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--gray)}
  .state h2{font-size:17px;color:var(--ink);margin:0 0 6px}
  .state a{color:var(--blue)}

  .guarantee{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:16px 18px;margin:22px 0 40px}
  .guarantee p{margin:0 0 10px;font-size:14px}
  .guarantee p:last-child{margin:0}
  footer{border-top:1px solid var(--line);padding:22px 0 44px;color:var(--gray);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap head-row">
  <div class="logo">fundhub<span>.</span></div>
  <span class="pill" id="clockPill">Loading</span>
</div></header>

<main class="wrap">
  <h1 id="title">Your live trial</h1>
  <p class="sub" id="subtitle">Real numbers from your own campaign, counted as they happen.</p>

  <div id="notices"></div>
  <div class="limit" id="limit" hidden></div>

  <div id="out">
    <div class="state"><h2>Loading your numbers</h2><p>One moment.</p></div>
  </div>
</main>

<footer><div class="wrap">
  <p>Funding and credit services are provided and performed by FundHub. Your brand is an independent marketing partner and is not the provider of these services.</p>
</div></footer>

<script>
(function () {
  "use strict";

  /* ────────────────────────────────────────────────────────────────────────
     FOUR FAILURE MODES, NAMED SEPARATELY. Copied deliberately from
     /partner/board/live: a 500 announced as "the database is down" sends
     whoever is paged to look at Postgres while the fault sits in the function
     logs.

       unauthorized — signed out, or the session is stale
       notfound     — signed in, but this account has no trial
       offline      — /api/* is not reachable at all
       server       — our side answered, and answered with an error
     ──────────────────────────────────────────────────────────────────────── */
  function token() {
    try { return localStorage.getItem("fh_token") || ""; } catch (e) { return ""; }
  }

  function load() {
    var t = token();
    var headers = { accept: "application/json" };
    if (t) headers.authorization = "Bearer " + t;

    return fetch("/api/trials/dashboard", { headers: headers })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) return { ok: false, reason: "unauthorized" };
        if (r.status === 404) return { ok: false, reason: "notfound" };
        return r.json().then(function (d) {
          if (!d || d.ok !== true) return { ok: false, reason: "server", message: d && d.message };
          return { ok: true, data: d };
        }).catch(function () { return { ok: false, reason: "offline" }; });
      })
      .catch(function () { return { ok: false, reason: "offline" }; });
  }

  var out = document.getElementById("out");
  var notices = document.getElementById("notices");
  var limitBox = document.getElementById("limit");
  var clockPill = document.getElementById("clockPill");
  var title = document.getElementById("title");
  var subtitle = document.getElementById("subtitle");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function state(head, body) {
    out.textContent = "";
    var box = el("div", "state");
    box.appendChild(el("h2", null, head));
    box.appendChild(el("p", null, body));
    out.appendChild(box);
  }

  /* NULL IS "not known yet", NEVER A ZERO AND NEVER A DASH. A missing sync and
     a measured zero are different facts with different conversations attached,
     and the reader has no way to tell them apart if they render the same. */
  function tile(label, value, note, opts) {
    var box = el("div", "tile" + (opts && opts.hero ? " hero" : ""));
    box.appendChild(el("p", "k", label));
    if (value === null || value === undefined) {
      box.appendChild(el("p", "v unknown", "not known yet"));
    } else {
      box.appendChild(el("p", "v", value));
    }
    if (note) box.appendChild(el("p", "n", note));
    return box;
  }

  function money(cents) {
    if (cents === null || cents === undefined) return null;
    var n = Number(cents) / 100;
    return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 });
  }

  function count(n) {
    if (n === null || n === undefined) return null;
    return Number(n).toLocaleString("en-US");
  }

  function when(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleString("en-US", {
      weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
    });
  }

  function renderClock(t) {
    if (!t) { clockPill.textContent = "—"; return; }
    if (t.phase === "held_start") {
      clockPill.className = "pill frozen";
      clockPill.textContent = "Waiting on Meta verification";
      return;
    }
    if (t.phase === "waiting_for_first_impression") {
      clockPill.className = "pill frozen";
      clockPill.textContent = "Not started yet";
      return;
    }
    if (t.phase === "converted") { clockPill.className = "pill live"; clockPill.textContent = "You are a partner"; return; }
    if (t.phase === "declined")  { clockPill.className = "pill frozen"; clockPill.textContent = "Trial closed — you kept your leads"; return; }
    if (t.phase === "refunded")  { clockPill.className = "pill frozen"; clockPill.textContent = "Refunded"; return; }
    if (t.phase === "conversion_call") {
      clockPill.className = "pill frozen";
      clockPill.textContent = "Day 8 — frozen and readable";
      return;
    }
    clockPill.className = "pill live";
    clockPill.textContent = "Day " + t.day + " of " + t.of_days;
  }

  function renderNotices(d) {
    notices.textContent = "";
    var list = (d && d.notes) || [];
    if (!list.length) return;
    var box = el("div", "notice");
    for (var i = 0; i < list.length; i++) box.appendChild(el("p", null, list[i].text));
    notices.appendChild(box);
  }

  function renderTiles(d) {
    var n = d.numbers || {};
    var t = d.trial || {};
    var grid = el("div", "tiles");

    /* BOOKED CALLS FIRST AND LARGEST. It is what they paid to watch, and a
       zero here is a real answer that stays visible rather than being tucked
       under an empty state. */
    grid.appendChild(tile("Booked calls", count(n.booked_calls),
      n.booked_calls === 0 ? "None yet." : null, { hero: true }));
    grid.appendChild(tile("Leads", count(n.leads), "People who left their details."));
    grid.appendChild(tile("Ad spend", money(n.spend_cents),
      "Your budget, on your card. The $297 does not include ad spend."));
    grid.appendChild(tile("Clicks", count(n.clicks)));
    grid.appendChild(tile("Impressions", count(n.impressions),
      n.days_synced ? (n.days_synced + " day(s) synced") : "Nothing synced from the platform yet."));
    grid.appendChild(tile("Days left", t.days_remaining === null || t.days_remaining === undefined
      ? null : count(t.days_remaining),
      t.started_at ? ("Started " + when(t.started_at)) : "Starts at your first ad impression."));
    out.appendChild(grid);
  }

  function renderBookings(d) {
    var rows = d.bookings || [];
    out.appendChild(el("h2", null, "Calls booked"));
    if (!rows.length) {
      var empty = el("div", "state");
      empty.appendChild(el("h2", null, "Nothing booked yet"));
      empty.appendChild(el("p", null,
        "When someone books, they appear here the moment it happens. We do not estimate this number and we do not fill it in."));
      out.appendChild(empty);
      return;
    }
    var scroll = el("div", "scroll");
    var table = el("table");
    var thead = el("thead");
    var hr = el("tr");
    ["Who", "When", "Status", "Source"].forEach(function (h) { hr.appendChild(el("th", null, h)); });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tb = el("tbody");
    for (var i = 0; i < rows.length; i++) {
      var b = rows[i];
      var tr = el("tr");
      tr.appendChild(el("td", null, b.display_name || "Lead"));
      tr.appendChild(el("td", "mono", when(b.starts_at) || "not known"));
      tr.appendChild(el("td", null, b.status || "booked"));
      tr.appendChild(el("td", null, b.source || "unknown"));
      tb.appendChild(tr);
    }
    table.appendChild(tb);
    scroll.appendChild(table);
    out.appendChild(scroll);
  }

  function renderPlan(d) {
    var plan = d.plan || [];
    var day = d.trial && d.trial.day;
    if (!plan.length) return;
    out.appendChild(el("h2", null, "What happens each day"));
    var ul = el("ul", "plan");
    for (var i = 0; i < plan.length; i++) {
      var p = plan[i];
      var cls = "";
      if (day) {
        if (p.day < day) cls = "done";
        else if (p.day === day) cls = "now";
      }
      var li = el("li", cls);
      li.appendChild(el("span", "day", "Day " + p.day));
      var body = el("div");
      body.appendChild(el("h3", null, p.title));
      body.appendChild(el("p", null, p.detail));
      li.appendChild(body);
      li.appendChild(el("span", "who", p.human ? "A person" : "Automatic"));
      ul.appendChild(li);
    }
    out.appendChild(ul);
  }

  function renderGuarantee(d) {
    var lines = d.guarantee || [];
    if (!lines.length) return;
    out.appendChild(el("h2", null, "What we owe you"));
    var box = el("div", "guarantee");
    for (var i = 0; i < lines.length; i++) box.appendChild(el("p", null, lines[i]));
    out.appendChild(box);
  }

  function render(d) {
    out.textContent = "";
    renderClock(d.trial);
    renderNotices(d);

    if (d.limitation) {
      limitBox.hidden = false;
      limitBox.textContent = d.limitation;
    }

    var t = d.trial || {};
    if (t.phase === "declined") {
      title.textContent = "Your trial is closed. Your leads are not.";
      subtitle.textContent = "You keep every lead this week produced. We work the ones that book, and you are paid as an affiliate on the ones we close.";
    } else if (t.phase === "converted") {
      title.textContent = "You are a partner.";
      subtitle.textContent = "These are the numbers your trial produced. Your leads stayed with you.";
    } else if (!t.live) {
      title.textContent = "Your live trial";
      subtitle.textContent = "This screen is frozen and stays readable" +
        (t.readable_until ? " until " + when(t.readable_until) : "") + ".";
    }

    renderTiles(d);
    renderBookings(d);
    renderPlan(d);
    renderGuarantee(d);
  }

  function refresh() {
    load().then(function (r) {
      if (r.ok) { render(r.data); return; }
      if (r.reason === "unauthorized") {
        state("Please sign in", "Your session has expired. Sign in again to see your trial.");
      } else if (r.reason === "notfound") {
        state("No trial on this account", "If you have just paid, give provisioning a few minutes. Otherwise contact support.");
      } else if (r.reason === "offline") {
        state("We cannot reach the server", "Your numbers are safe. This is a connection problem, not a data problem.");
      } else {
        state("Something went wrong on our side", r.message || "We have logged it. Your numbers are not affected.");
      }
    });
  }

  refresh();
  // A live trial is watched, so it refreshes itself. Sixty seconds is often
  // enough for a product whose fastest-moving number is a booked call.
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
