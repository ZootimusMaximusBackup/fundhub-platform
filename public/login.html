<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fundhub — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fh.css">
</head><body>
<div class="spectrum"></div>
<div class="login-box">
  <div class="card">
    <h1>fundhub matrix</h1>
    <p class="sub" style="margin:0">Sign in</p>
    <div class="err" id="err"></div>
    <form id="f">
      <input id="email" type="email" placeholder="email" autocomplete="username" value="chris@fundhub.ai" required>
      <!-- NOT pre-filled. This field used to ship value="demo1234", which is 8
           characters; src/auth/hash.mjs enforces a 12-character minimum in
           hashPassword(), so no stored hash for it can exist and the pre-fill
           was guaranteed to produce "Wrong email or password." on a perfectly
           healthy backend. -->
      <input id="pw" type="password" placeholder="password" autocomplete="current-password" required autofocus>
      <button class="btn primary" id="go" type="submit">Sign in</button>
    </form>
    <p class="note" style="margin-top:14px">Enter your password to continue.</p>
    <p class="note"><a href="/" style="text-decoration:underline">← Back to fundhub.ai</a></p>
  </div>
</div>
<script src="/fh.js"></script>
<script>
// Landing on the sign-in page always re-tries the real backend. fh.js keeps a
// client-side demo mode in localStorage, and once it engages it answers
// /api/auth/login from a hardcoded table without sending anything to the
// server — so a correct new password comes back "Wrong email or password."
// with no request ever leaving the browser. Clearing it here means nobody has
// to know that, or open a console to escape it. Demo mode simply re-engages on
// the next attempt if the backend really is absent.
try { localStorage.removeItem("fh_demo"); localStorage.removeItem("fh_demo_staff"); } catch (e) {}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err"), btn = document.getElementById("go");
  err.style.display = "none"; btn.disabled = true; btn.textContent = "Signing in…";
  const { ok, status, data } = await FH.api("/api/auth/login", {
    method: "POST",
    body: { email: document.getElementById("email").value, password: document.getElementById("pw").value }
  });
  btn.disabled = false; btn.textContent = "Sign in";
  if (!ok) {
    // Distinct failures have to read as distinct failures. This branch used to
    // collapse every non-429/403 response into "Wrong email or password.", so a
    // 500 from a missing table and a dead function both accused the user of
    // mistyping a password they had typed correctly. Never guess at a status.
    const s = Number(status) || 0;
    let msg;
    if (s === 401)      msg = "Wrong email or password.";
    else if (s === 403) msg = "Account not active — ask an admin.";
    else if (s === 429) msg = "Too many attempts — wait 15 minutes.";
    else if (s === 400) msg = "Enter both an email and a password.";
    else if (s >= 500)  msg = "Server error (HTTP " + s + ") — this is not your password. "
                            + "The backend could not complete the request.";
    else if (!s || !data) msg = "Could not reach the server — this is not your password.";
    else                msg = "Sign-in failed (HTTP " + s + ").";
    err.style.display = "block";
    err.textContent = msg;
    return;
  }
  if (data.token) localStorage.setItem("fh_token", data.token);
  // Hand the role to /app/shell.js so the first screen is gated before it
  // paints, instead of drawing and then bouncing while the session resolves.
  if (data.staff && data.staff.role) {
    localStorage.setItem("fh_role", String(data.staff.role).trim().toLowerCase());
  } else {
    localStorage.removeItem("fh_role");
  }
  const next = new URLSearchParams(location.search).get("next");
  location.href = next && next.startsWith("/") ? next : "/app/";
});
</script>
</body></html>
