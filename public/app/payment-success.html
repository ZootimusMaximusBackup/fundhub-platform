<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundhub · Payment received</title>
<link rel="stylesheet" href="fundhub-brand.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;padding:28px 18px}
.card{max-width:420px;width:100%;border:1px solid var(--line);border-radius:14px;padding:28px 24px;background:var(--soft)}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray2)}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:12px 0 8px;line-height:1.15}
.lede{font-size:14px;color:var(--gray);line-height:1.5;margin:0 0 18px}
.ok{border:1px solid #2C5138;background:rgba(168,216,176,.26);color:#2C5138;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.45}
.fine{font-size:11px;color:var(--gray2);margin-top:16px;line-height:1.45}
</style>
</head>
<body>
  <div class="card">
    <div class="mono">Fundhub · payment</div>
    <h1>Payment received</h1>
    <p class="lede">Thanks — your payment cleared. Stay on the call with your advisor.</p>
    <div class="ok">If this was your soft-pull assessment, we start the credit pull next. You do not need to do anything else on this page.</div>
    <p class="fine">You can close this tab and return to your Meet.</p>
  </div>
</body>
</html>
