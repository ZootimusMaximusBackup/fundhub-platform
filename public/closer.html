<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fundhub — Closer Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fh.css">
</head><body>
<div class="spectrum"></div>
<header class="top"><span class="brand">fundhub matrix</span><nav></nav><span class="who"></span><button id="logout">Sign out</button></header>
<div class="wrap">
  <h1>Closer Dashboard</h1>
  <p class="sub">Select a client to view their deal.</p>
  <div class="kpis" id="kpis"></div>
  <div class="split">
    <div class="card">
      <h2>Clients</h2>
      <div class="row" style="margin-bottom:10px"><input id="q" placeholder="Search clients…" style="flex:1"></div>
      <table class="tbl"><thead><tr>
        <th>Client</th><th>Outcome</th><th class="right">Prequal</th><th class="right">Funded</th><th>CRS</th><th>Tasks</th>
      </tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table>
    </div>
    <div id="detail"><div class="card"><div class="empty">Pick a client on the left.</div></div></div>
  </div>
</div>
<script src="/fh.js"></script>
<script>
let CLIENTS = [], SELECTED = null;
const rows = document.getElementById("rows");

function renderList() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = CLIENTS.filter(c =>
    !q || `${c.first_name||""} ${c.last_name||""} ${c.email||""}`.toLowerCase().includes(q));
  rows.innerHTML = list.length ? "" : `<tr><td colspan="6" class="empty">No clients.</td></tr>`;
  for (const c of list) {
    rows.insertAdjacentHTML("beforeend", `
      <tr class="click" onclick="pick('${c.id}')">
        <td><b>${FH.esc((c.first_name||"") + " " + (c.last_name||""))}</b><br><span class="muted mono">${FH.esc(c.email||"")}</span></td>
        <td>${FH.tierChip(c.outcome_tier)}</td>
        <td class="right">${FH.money(c.custom_fields?.total_funding_estimate)}</td>
        <td class="right">${c.funded ? FH.money(c.funded_amount) : "—"}</td>
        <td>${Number(c.crs_count) ? `<span class="chip info">${c.crs_count} pull${c.crs_count>1?"s":""}</span>` : `<span class="chip alert">Never Pulled</span>`}</td>
        <td>${Number(c.task_count) ? `<span class="chip warn">${c.task_count} open</span>` : `<span class="chip">0</span>`}</td>
      </tr>`);
  }
}

function kpis() {
  const total = CLIENTS.length;
  const prequal = CLIENTS.reduce((s,c)=> s + (Number(c.custom_fields?.total_funding_estimate)||0), 0);
  const funded = CLIENTS.filter(c=>c.funded).reduce((s,c)=> s + (Number(c.funded_amount)||0), 0);
  const needsCrs = CLIENTS.filter(c=>!Number(c.crs_count)).length;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi info"><div class="lbl">Total clients</div><div class="val">${total}</div></div>
    <div class="kpi warn"><div class="lbl">Needs pull</div><div class="val">${needsCrs}</div></div>
    <div class="kpi accent"><div class="lbl">Total prequal</div><div class="val">${FH.money(prequal)}</div></div>
    <div class="kpi ok"><div class="lbl">Total funded</div><div class="val">${FH.money(funded)}</div></div>`;
}

async function load() {
  const { ok, data } = await FH.api("/api/dashboard/clients?limit=200");
  if (!ok) return;
  CLIENTS = data.clients || [];
  kpis(); renderList();
}

window.pick = async (id) => {
  SELECTED = id;
  const box = document.getElementById("detail");
  box.innerHTML = `<div class="card"><div class="empty">Loading…</div></div>`;
  const { ok, data } = await FH.api("/api/dashboard/client?id=" + id);
  if (!ok) { box.innerHTML = `<div class="card"><div class="empty">Failed to load.</div></div>`; return; }
  const c = data.client, cf = c.custom_fields || {};
  const flags = [
    cf.crs_paid ? `<span class="chip ok">CRS paid</span>` : `<span class="chip">CRS unpaid</span>`,
    cf.deposit_paid ? `<span class="chip ok">Deposit paid</span>` : `<span class="chip">No deposit</span>`,
    cf.sale_closed ? `<span class="chip ok">Sale closed</span>` : `<span class="chip">Not closed</span>`
  ].join(" ");
  box.innerHTML = `
    <div class="card">
      <h2>${FH.esc((c.first_name||"")+" "+(c.last_name||""))}</h2>
      <div class="row" style="margin-bottom:10px">${FH.tierChip(c.outcome_tier)} ${flags}</div>
      <div class="kv">
        <span class="k">Email</span><span class="mono">${FH.esc(c.email||"—")}</span>
        <span class="k">Phone</span><span class="mono">${FH.esc(c.phone||"—")}</span>
        <span class="k">Prequal</span><span>${FH.money(cf.total_funding_estimate)}</span>
        <span class="k">Funded</span><span>${c.funded ? FH.money(c.funded_amount) + (c.days_to_fund ? ` · ${c.days_to_fund}d` : "") : "—"}</span>
        <span class="k">Source</span><span>${FH.esc(c.channel_source||"—")}</span>
        <span class="k">Created</span><span>${FH.ago(c.created_at)} ago</span>
      </div>
    </div>
    <div class="card"><h2>CRS results (${data.crs_results.length})</h2>
      ${data.crs_results.length ? data.crs_results.map(r =>
        `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--soft);padding:6px 0">
           <span>${FH.tierChip(r.outcome_tier)}</span><span class="muted">${FH.ago(r.created_at)} ago</span></div>`).join("")
        : `<div class="empty">Never pulled.</div>`}
    </div>
    <div class="card"><h2>Transactions (${data.transactions.length})</h2>
      ${data.transactions.length ? data.transactions.map(t =>
        `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--soft);padding:6px 0">
           <span>${FH.esc(t.product_name||"—")}</span>
           <span><b>${FH.money(t.amount_paid)}</b> <span class="chip ${t.status==='paid'?'ok':''}">${FH.esc(t.status||"")}</span></span></div>`).join("")
        : `<div class="empty">None.</div>`}
    </div>
    <div class="card"><h2>Open tasks</h2>
      ${data.tasks.filter(t=>!t.done).length ? data.tasks.filter(t=>!t.done).map(t =>
        `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--soft);padding:6px 0">
           <span>${FH.esc(t.title)}<br><span class="muted mono">${FH.esc(t.source_workflow||"")}</span></span>
           <button class="btn" onclick="doneTask('${t.id}')">Done</button></div>`).join("")
        : `<div class="empty">Clear.</div>`}
    </div>`;
};

window.doneTask = async (id) => {
  const { ok } = await FH.api("/api/tasks", { method: "PATCH", body: { id, done: true } });
  if (ok) { FH.toast("Task done"); if (SELECTED) pick(SELECTED); load(); }
};

(async () => {
  if (!(await FH.guard())) return;
  document.getElementById("q").addEventListener("input", renderList);
  FH.poll(load, 15000);
})();
</script>
</body></html>
