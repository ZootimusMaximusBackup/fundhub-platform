<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fundhub — Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fh.css">
</head><body>
<div class="spectrum"></div>
<header class="top"><span class="brand">fundhub matrix</span><nav></nav><span class="who"></span><button id="logout">Sign out</button></header>
<div class="wrap">
  <h1 id="hi">Welcome</h1>
  <p class="sub">Live v0 — real data, real login. Mockups for everything else stay at the wireframes site.</p>
  <div class="kpis" id="cards"></div>
</div>
<script src="/fh.js"></script>
<script>
(async () => {
  const staff = await FH.guard(); if (!staff) return;
  document.getElementById("hi").textContent = "Welcome, " + (staff.name || staff.email).split(" ")[0];
  const role = String(staff.role || "").toLowerCase();
  const all = [
    { href: "/closer.html",  t: "Closer Dashboard", d: "Clients, deals, journey state", roles: ["closer","funding_advisor","admin","owner"], cls: "info" },
    { href: "/ops.html",     t: "Advisor Ops",      d: "Queue, blockers, client panel", roles: ["funding_advisor","admin","owner"], cls: "warn" },
    { href: "/tasks.html",   t: "Task Inbox",       d: "Everything the workflows queued", roles: ["closer","funding_advisor","inquiry_specialist","setter","admin","owner"], cls: "accent" },
    { href: "/inquiry.html", t: "Inquiry Console",  d: "Supervise the AI caller", roles: ["inquiry_specialist","admin","owner"], cls: "ok" }
  ];
  const cards = document.getElementById("cards");
  for (const c of all) {
    if (!(role === "owner" || c.roles.includes(role))) continue;
    cards.insertAdjacentHTML("beforeend",
      `<a class="kpi ${c.cls}" style="text-decoration:none" href="${c.href}">
         <div class="lbl">${c.t}</div><div style="margin-top:6px;font-size:13px;color:var(--gray)">${c.d}</div></a>`);
  }
})();
</script>
</body></html>
