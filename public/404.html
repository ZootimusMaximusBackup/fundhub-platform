<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fundhub — Not found</title>
<!-- Styles are inline on purpose: a 404 that depends on a stylesheet is one
     more thing that can fail to load on the page whose job is to explain a
     failure. -->
<style>
  :root{
    --spectrum:linear-gradient(90deg,#F2A69B 0%,#F5CE8F 20%,#F2E39B 40%,#A8D8B0 60%,#A9C6E8 80%,#C4B3E5 100%);
    --paper:#FCFCFC; --ink:#0A0A0A; --ink2:#18181B;
    --gray:#52525B; --gray2:#A1A1AA; --line:#E4E4E7;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--paper);color:var(--ink2);font-family:var(--sans);
    display:flex;flex-direction:column;
  }
  .spectrum{height:3px;background:var(--spectrum);flex:0 0 3px}
  main{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    max-width:620px;width:100%;margin:0 auto;padding:56px 28px;
  }
  .code{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gray2);margin:0 0 14px;
  }
  h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
  p{font-size:13.5px;line-height:1.65;color:var(--gray);margin:0 0 22px;max-width:56ch}
  .where{
    font-family:var(--mono);font-size:12px;color:var(--ink2);
    background:#F4F4F5;border:1px solid var(--line);border-radius:6px;
    padding:9px 12px;margin:0 0 26px;word-break:break-all;
  }
  ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  li a{
    display:flex;align-items:baseline;gap:14px;padding:12px 2px;
    color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:700;
  }
  li a:hover{text-decoration:underline}
  li a .q{font-weight:400;font-size:12.5px;color:var(--gray)}
  footer{
    height:26px;background:var(--ink);display:flex;align-items:center;
    padding:0 14px;gap:16px;font-family:var(--mono);font-size:10px;
    letter-spacing:.06em;text-transform:lowercase;color:var(--gray2);
  }
  @media (max-width:560px){ li a{flex-wrap:wrap;gap:4px} }
</style>
</head>
<body>
<div class="spectrum"></div>

<main>
  <p class="code">404 · page not found</p>
  <h1>That address doesn't exist here.</h1>
  <p>Nothing is served at the path below. It was either mistyped, or it points at
    something that has moved.</p>
  <div class="where" id="where">—</div>

  <ul>
    <li><a href="/app/">The CRM<span class="q">sign-in required</span></a></li>
    <li><a href="/">fundhub.ai<span class="q">the public site</span></a></li>
    <li><a href="/login.html">Sign in<span class="q">staff and demo access</span></a></li>
  </ul>
</main>

<footer><span>fundhub · 404</span></footer>

<script>
  // Show what was actually requested — the single most useful fact when
  // someone reports "it isn't loading".
  document.getElementById("where").textContent = location.pathname + location.search;
</script>
</body>
</html>
