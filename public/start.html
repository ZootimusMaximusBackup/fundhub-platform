<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start | fundhub</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#0A0A0A;--paper:#FCFCFC;--gray:#52525B;--line:#E4E4E7;--sans:Inter,system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,monospace}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:520px;margin:12vh auto;padding:0 24px;text-align:center}
  .code{font-family:var(--mono);letter-spacing:.08em;font-size:13px;color:var(--gray);margin-bottom:12px}
  h1{font-size:28px;font-weight:650;margin:0 0 12px}
  p{color:var(--gray);margin:0 0 24px}
  a.btn{display:inline-block;background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code" id="code">Referral</div>
    <h1>Continue to apply</h1>
    <p id="lead">This link belongs to an affiliate. We will send you to the Fundhub apply form with their code attached.</p>
    <a class="btn" id="go" href="https://apply.fundhub.ai/">Go to apply</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var ref = String(params.get("ref") || params.get("a1") || "").trim();
      if (ref) {
        try { localStorage.setItem("fh_ref", ref); } catch (e) {}
        document.getElementById("code").textContent = "Code " + ref;
      } else {
        document.getElementById("code").textContent = "No code on this link";
        document.getElementById("lead").textContent = "Open the apply form to continue.";
      }
      var dest = "https://apply.fundhub.ai/";
      if (ref) dest += "?a1=" + encodeURIComponent(ref) + "&ref=" + encodeURIComponent(ref);
      document.getElementById("go").href = dest;
      if (ref) location.replace(dest);
    })();
  </script>
</body>
</html>
