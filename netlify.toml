# Netlify deploy for fundhub-platform — static screens from public/ plus the
# existing Vercel-style api/ handlers running as one Netlify function.
# The Vercel files are untouched; when that account clears, both targets work.

[build]
  publish = "public"
  # Still no build step — public/ is static and the functions are bundled by
  # Netlify. The command runs the database privilege guard instead.
  #
  # This is no longer the ONLY gate in the repo — .github/workflows/tests.yml
  # now runs the suite on every push — but it is still the only one that sees a
  # REAL DATABASE_URL. CI points at a throwaway container; this build is the
  # single place the question "is the connection the live site uses actually
  # unprivileged?" can be asked and answered. Keep it.
  #
  # `npm run guard:db` runs ONE test file, deliberately not `npm test`. The
  # full suite has known pre-existing failures against a real database
  # (CLAUDE.md §12), so gating deploys on it would block every deploy on day
  # one and the gate would be removed within a week. A guard nobody can afford
  # to keep is not a guard.
  #
  # What it does: refuses the deploy if DATABASE_URL for this context points at
  # a superuser, or a role that can bypass Row Level Security, or is missing
  # from the build scope entirely. It runs per context, so production,
  # deploy-preview and branch-deploy are each checked with their own value.
  #
  # If this ever blocks a deploy you need to make, the escape is to revert this
  # line to the old `echo` — not to weaken src/security/superuser-guard.test.mjs.
  command = "npm run guard:db"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# THE ONE SCHEDULED JOB IN THIS REPOSITORY.
#
# netlify/functions/staff-message-sweeper.mjs releases outbound STAFF messages
# that were held — overnight quiet hours, or a provider that failed in a way
# worth retrying. Without it, a text typed at 11pm is held until 11am and then
# sits there forever, because nothing else in this codebase has ever called the
# dispatcher on a clock.
#
# It is scoped to messages a person actually wrote (sender_staff_id IS NOT
# NULL). It does NOT drain the several thousand rows queued by workflows over
# the past months — see the header of that file before widening it.
#
# Declared here rather than with the @netlify/functions `schedule()` wrapper so
# no npm dependency is added for it (CLAUDE.md §8). The value must match
# SWEEP_CRON in that file; src/messaging/staff-sweeper.test.mjs fails if the two
# ever disagree.
#
# This is NOT the Inngest engine. INNGEST_EVENT_KEY remains unset and the 47
# workflow functions remain dormant — turning those on is still an owner
# decision (CLAUDE.md §11).
# ---------------------------------------------------------------------------
[functions."staff-message-sweeper"]
  schedule = "*/5 * * * *"

# ---------------------------------------------------------------------------
# Routing
#
# The CRM lives in the directory public/app/, so its URL is /app/. There used
# to be a public/app.html redirect stub alongside it, which meant two files
# claimed the same URL: Netlify resolves /app to the *file* app.html, while the
# stub's own script sent the browser to /app/ — and /app/ normalises back to
# /app whenever a sibling .html exists. That is a redirect loop, and it is why
# /app never finished loading. The stub is gone; these rules make what is left
# explicit instead of leaving it to filename-resolution order.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# Old bookmarks and any link written before the move.
[[redirects]]
  from = "/app.html"
  to = "/app/"
  status = 301

# The api/ handlers run as one function. netlify/functions/api.mjs already
# declares `config.path = "/api/*"`; this rewrite is the belt to that braces, so
# /api/* still routes if the v2 path config is not honoured. The function
# tolerates either URL shape — see the prefix stripping in its handler.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
